name: Daily Active ETF Data Fetch
on:
  schedule:
    - cron: '0 9 * * 1-5'  # 每週一至五 UTC 09:00 = 台北時間 17:00
  workflow_dispatch:         # 手動觸發

permissions:
  contents: write            # 允許 push 回 repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests firebase-admin yfinance

      - name: Fetch and update data
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/update_data.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "📊 自動更新 $(date +'%Y-%m-%d') 持股資料"
          git push

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Build and deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm ci
          npm run build
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx -y firebase-tools@13 deploy --only hosting --non-interactive
          else
            echo "Firebase deploy skipped (no token)"
          fi
